server {
    listen 80;
    listen [::]:80;

    # Root-Verzeichnis für statische Frontend-Dateien (HTML, JS, CSS)
    root /usr/share/nginx/html;
    
    # Standard-Index-Dateien
    index login.html main.html; 

    # 1. API-Endpunkte (JWT und zukünftige API-Routen)
    # Leitet ALLES von /api/ an den Django-Container
    location /api/ {
        proxy_pass http://login-backend:8000;

        # Standard-Proxy-Header (wichtig für Django)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Frontend-Handling und Static Files
    # Sucht zuerst nach der angeforderten Datei ($uri) oder dem Verzeichnis ($uri/)
    location / {
        # WICHTIG: Wenn die Datei (login.html, main.html) nicht existiert,
        # soll Nginx einen 404-Fehler werfen, NICHT an Django weiterleiten.
        try_files $uri $uri/ =404; 
        
        # Caching-Header für statische Dateien (kann später optimiert werden)
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Der @django-Block wird entfernt, da er nicht mehr benötigt wird.
}