server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index start.html login.html main.html;

    include /etc/nginx/mime.types;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    location ~ \.(css|js)$ {
        root /usr/share/nginx/html;
        types {
            text/css css;
            application/javascript js;
        }
    }

    location /api/ {
        # ... Proxy-Einstellungen wie gehabt ...
        proxy_pass http://login-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ \.html$ {
    rewrite ^/(.*)\.html$ /$1 permanent;
    }

    location = /login {
        proxy_pass http://login-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = / {
        proxy_pass http://login-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /register {
        proxy_pass http://login-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /main {
        proxy_pass http://login-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 1b. Weiterleitung des Admin-Pfades an Django
    location /admin/ {
        # Der Admin-Pfad ist dynamisch und muss an Django gesendet werden
        proxy_pass http://login-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Optional: Weiterleitung der statischen Admin-Dateien (CSS/JS) an Django, 
    # falls Sie `collectstatic` nicht verwenden
    location /static/admin/ {
        proxy_pass http://login-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Frontend-Handling und Static Files
    location / {
        # Sucht nur nach statischen Frontend-Dateien, wenn /api/ oder /admin/ nicht zutraf.
        # WICHTIG: Wenn Sie React/Vue/Angular (echte SPA) verwenden, MÜSSTE dies $uri /index.html sein
        # Da Sie /login.html und /main.html haben, ist try_files $uri $uri/ =404 in Ordnung für Ihre statischen Dateien.
        try_files $uri $uri/ =404; 
        
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}