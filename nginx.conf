server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    # Startseite wird über Django geregelt, daher hier nicht zwingend nötig
    index start.html; 

    include /etc/nginx/mime.types;

    location /static/ {
        alias /app/staticfiles/; # Pfad zum STATIC_ROOT im Container
    }

    # --- 1. Statische Dateien (CSS, JS, Bilder) ---
    # Diese Dateien liegen physikalisch im Nginx-Container
    location ~ \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        include /etc/nginx/mime.types;
        root /usr/share/nginx/html;
        access_log off;
        expires max;
        # Falls mime.types nicht greift, erzwingen wir es hier:
        types {
            text/css css;
            application/javascript js;
        }
    }

    # --- 2. HTML-Endungen entfernen (SEO / Clean URLs) ---
    # Leitet z.B. /login.html permanent auf /login um
    location ~ \.html$ {
        rewrite ^/(.*)\.html$ /$1 permanent;
    }

    # --- 3. Django Backend Locations (Proxy) ---
    # Alles was logik braucht, geht an den "login-backend" Container

    # API-Anfragen
    location /api/ {
        proxy_pass http://login-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Die einzelnen Seiten (werden von Django gerendert)
    # Nutze "location = /pfad" für exakte Treffer
    location = / { 
        proxy_pass http://login-backend:8000; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location = /login { 
        proxy_pass http://login-backend:8000; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme; 
    }
    
    location = /register { 
        proxy_pass http://login-backend:8000; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme; 
    }
    
    location = /main { 
        proxy_pass http://login-backend:8000; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme; 
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://login-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin Static Files
    location /static/admin/ {
        proxy_pass http://login-backend:8000;
        proxy_set_header Host $host;
    }

    # --- 4. Fallback ---
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    server_name mail.aetherus.net;
    location / {
        proxy_pass http://172.17.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}