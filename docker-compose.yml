services:
  # -------------------- Caddy Reverse Proxy --------------------
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy-setup/Caddyfile:/etc/caddy/Caddyfile
      # Wir mounten die statischen Dateien direkt in Caddy
      - ./main/frontend:/usr/share/caddy/html
      - ./backend/staticfiles:/app/staticfiles:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aetherus-net
    # Wichtig: Caddy muss wissen, wo die Mailcow-IP (172.30.1.1) liegt. 
    # Docker findet das normalerweise über das Gateway.

  # -------------------- Django Backend --------------------
  login-backend:
    command: python manage.py runserver 0.0.0.0:8000
    build: ./main/backend
    container_name: login-backend
    restart: unless-stopped
    volumes:
      - ./main/backend:/app
      # Falls Django Static-Files generiert, teilen wir sie hier
      - ./backend/staticfiles:/app/staticfiles
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    networks:
      - aetherus-net

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: aetherus-redis
    restart: always
    networks:
      - aetherus-net
    volumes:
      - redis_data:/data

networks:
  aetherus-net:
    driver: bridge
  mailcow-net:
    external: true
    name: mailcowdockerized_mailcow-network


volumes:
  caddy_data:
  caddy_config:
  redis_data: