services:
  # -------------------- Caddy Reverse Proxy --------------------
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      # Exponiert HTTP und HTTPS nach außen
      - "80:80"
      - "443:443"
    volumes:
      # Verknüpft das lokale Caddyfile mit dem Container
      - ./caddy-setup/Caddyfile:/etc/caddy/Caddyfile
      # Persistenter Speicher für Zertifikate und Logs
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aetherus-net

  # -------------------- Ihre Website/Anwendung --------------------
  aetherus-container:
    # Ersetzen Sie 'nginx:latest' durch das Image Ihrer Anwendung
    # Beispiel: Wenn Sie eine statische Seite haben, können Sie Nginx verwenden
    # Wenn Sie ein eigenes Projekt haben, verwenden Sie Ihr eigenes Image
    image: nginx:latest
    container_name: aetherus-container
    restart: unless-stopped
    volumes:
    - ./main/frontend:/usr/share/nginx/html
    - ./backend/staticfiles:/usr/share/nginx/html/static:ro
    - ./nginx.conf:/etc/nginx/conf.d/default.conf
    # Wichtig: Dieser Container muss NICHT seine Ports direkt nach außen exponieren,
    # da Caddy (im selben Netzwerk) ihn anspricht.
    networks:
      - aetherus-net
    # Optional: Volume-Mount für die Website-Dateien
    # volumes:
    #   - ./my-website-files:/usr/share/nginx/html

  login-backend:
    build: ./main/backend
    container_name: login-backend
    volumes:
      - ./main/backend:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    networks:
      - aetherus-net

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: aetherus-redis
    restart: always
    networks:
      - aetherus-net
    volumes:
      - redis_data:/data

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail
    domainname: aetherus.net
    # Wir brauchen diese Ports für SMTP (Versand) und IMAP (Empfang)
    ports:
      - "25:25"    # SMTP (Server-to-Server)
      - "587:587"  # Submission (Django-to-Mailserver)
      - "993:993"  # IMAP (Falls du die Mails per Outlook/Handy lesen willst)
    volumes:
      - ./docker-data/dms/mail-data:/var/mail
      - ./docker-data/dms/mail-state:/var/mail-state
      - ./docker-data/dms/mail-logs:/var/log/mail
      - ./docker-data/dms/config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_SPAMASSASSIN=0 # Spart RAM
      - ENABLE_CLAMAV=0       # Spart viel RAM (Antivirus)
      - ENABLE_FAIL2BAN=1
      - OVERRIDE_HOSTNAME=mail.aetherus.net
      - SPOOF_PROTECTION=0    # Erleichtert den Start für Django
      - TLS_LEVEL=clear
    restart: always

networks:
  aetherus-net:
    driver: bridge
    # Definiert ein gemeinsames Netzwerk, damit Caddy den Website-Container ansprechen kann

volumes:
  caddy_data:
  caddy_config:
  redis_data:
