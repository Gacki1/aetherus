services:
  # -------------------- Caddy Reverse Proxy --------------------
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy-setup/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      
      # WICHTIG: Nur das Volume mounten, in das Django kopiert!
      # Keine lokalen Ordner drüber mounten.
      - static_volume:/app/staticfiles
      
    networks:
      - aetherus-net
      - mailcow-net

  # -------------------- Django Backend --------------------
  backend:
    # Wichtig: Der Command muss in einem Shell-Format sein, wenn er Argumente hat, 
    # aber so wie du es hast, geht es oft auch. Besser ist:
    command: sh -c "python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    build: ./main/backend
    container_name: backend
    restart: unless-stopped
    volumes:
      # Nur den Code-Ordner mounten
      - ./main/backend:/app
      
      # Das gemeinsame Volume für statische Dateien
      - static_volume:/app/staticfiles
      
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/1
      - PYTHONUNBUFFERED=1 # Damit du Logs sofort siehst
    depends_on:
      - redis
    networks:
      - aetherus-net

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: aetherus-redis
    restart: always
    networks:
      - aetherus-net
    volumes:
      - redis_data:/data
    expose:
      - 6379

networks:
  aetherus-net:
    driver: bridge
  mailcow-net:
    external: true
    name: mailcowdockerized_mailcow-network

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  static_volume: