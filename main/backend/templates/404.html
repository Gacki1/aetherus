{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherus - 404</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #0a0c10;
            color: #f0f2f5;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 102, 204, 0.1) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            z-index: 0;
        }

        .error-container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #0088ff, #00d2ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            line-height: 1;
            text-shadow: none;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% { filter: none; }
            92% { filter: blur(2px); }
            94% { filter: none; }
            96% { filter: blur(1px); }
        }

        .error-title {
            font-size: 1.5rem;
            color: #8b949e;
            margin: 1rem 0 2rem;
            font-weight: 400;
        }

        .error-subtitle {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 3rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #0055aa, #0088ff);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 85, 170, 0.4);
        }

        .error-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(0, 136, 255, 0.6);
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Seite nicht gefunden</h1>
        <p class="error-subtitle">Die angeforderte Seite existiert nicht oder wurde verschoben.</p>
        <a href="/" class="error-btn">Zurück zur Startseite</a>
    </div>
</body>
</html>
