{% extends "admin/base.html" %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 10px;">
        <span
            style="color: var(--accent); font-weight: 800; letter-spacing: 1px; filter: drop-shadow(0 0 5px rgba(245, 221, 93, 0.5));">
            AETHERUS
        </span>
        <span style="color: #fff; font-weight: 200; opacity: 0.8;">CONTROL</span>
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        /* Tiefes Aetherus-Rot-Schema */
        --primary: #bb2124;
        --secondary: #4a0e0e;
        /* Sehr dunkles Rot für Tiefe */
        --accent: #f5dd5d;
        --primary-fg: #fff;

        /* Hintergrund mit Tiefe (Radialer Verlauf wie auf der Main-Page) */
        --body-bg: #0f0505;
        --darkened-bg: #1a0808;

        --header-bg: linear-gradient(135deg, #6b1113 0%, #3a0809 100%);
        --header-color: #fff;

        --breadcrumbs-bg: #2d0a0a;
        --link-fg: #ff4d4d;
        --link-hover-color: #ff8080;

        --button-bg: linear-gradient(180deg, #bb2124 0%, #8b1618 100%);
        --button-hover-bg: #d92629;
    }

    /* Der leuchtende Hintergrund-Effekt */
    body {
        background: radial-gradient(circle at 50% -20%, #4a0e0e 0%, #0f0505 80%) no-repeat fixed !important;
        color: #eee !important;
    }

    /* Header mit Glow und Tiefe */
    #header {
        background: var(--header-bg) !important;
        border-bottom: 1px solid rgba(255, 77, 77, 0.3) !important;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5) !important;
    }

    /* Module (Boxen) mit Glas-Effekt */
    .module {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 77, 77, 0.1) !important;
        backdrop-filter: blur(10px);
        border-radius: 8px !important;
        overflow: hidden;
    }

    .module h2,
    .module th,
    .selector-chosen h2 {
        background: linear-gradient(90deg, #8b1618 0%, #bb2124 100%) !important;
        color: #fff !important;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* Breadcrumbs (Pfadanzeige) */
    div.breadcrumbs {
        background: var(--breadcrumbs-bg) !important;
        border-bottom: 1px solid rgba(255, 77, 77, 0.2) !important;
        color: #ccc !important;
    }

    /* Buttons mit Leuchten */
    .button,
    input[type=submit],
    input[type=button],
    .submit-row input {
        background: var(--button-bg) !important;
        border: none !important;
        box-shadow: 0 0 10px rgba(187, 33, 36, 0.3) !important;
        transition: all 0.3s ease !important;
    }

    .button:hover,
    input[type=submit]:hover {
        box-shadow: 0 0 20px rgba(187, 33, 36, 0.6) !important;
        transform: translateY(-1px);
    }

    /* Sidebar Anpassung */
    #nav-sidebar {
        background: rgba(15, 5, 5, 0.95) !important;
        border-right: 1px solid rgba(255, 77, 77, 0.2) !important;
    }

    /* Tabellen-Zeilen */
    .row1 {
        background: rgba(255, 255, 255, 0.02) !important;
    }

    .row2 {
        background: rgba(255, 255, 255, 0.05) !important;
    }

    tr:hover {
        background: rgba(187, 33, 36, 0.1) !important;
    }
</style>
{% endblock %}
