{% extends "admin/base.html" %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | {{ site_title|default:_('Django site admin')
}}{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="color: var(--accent);">
        AETHERUS <span style="color: white;">CONTROL</span>
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* DEINE ROTEN FARBEN - Orientiert an deinem Main-Design */
    :root {
        --primary: #bb2124;
        /* Kräftiges Rot */
        --secondary: #8b1a1a;
        /* Dunkleres Rot für Header */
        --accent: #f5dd5d;
        /* Gold-Gelb für den Text-Akzent */
        --primary-fg: #fff;

        --header-bg: var(--secondary);
        --header-color: #fff;
        --header-branding-color: var(--accent);

        --breadcrumbs-bg: #5a1212;
        /* Sehr dunkles Rot */
        --link-fg: #a11f1f;
        --link-hover-color: #7a1515;
    }

    /* Dark Mode Korrekturen */
    @media (prefers-color-scheme: dark) {
        :root {
            --primary: #7a1515;
            --secondary: #4a0000;
            --breadcrumbs-bg: #330000;
            --link-fg: #ff6b6b;
            --selected-row: #4a0000;
        }
    }

    #header {
        background: var(--secondary) !important;
    }

    .module h2,
    .module th,
    .selector-chosen h2 {
        background: var(--primary) !important;
    }

    div.breadcrumbs {
        background: var(--breadcrumbs-bg) !important;
    }

    .button,
    input[type=submit] {
        background: var(--primary) !important;
    }
</style>
{% endblock %}
