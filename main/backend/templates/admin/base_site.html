{% extends "admin/base.html" %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
        <div class="core-container">
            <div class="core-node"></div>
            <div class="core-ring"></div>
        </div>
        <span class="logo-text">AETHERUS</span>
        <span class="logo-sub">SECURE_INTERFACE_v3.0</span>
    </a>
</h1>

<style>
    .core-container {
        position: relative;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .core-node {
        width: 8px;
        height: 8px;
        background: #ff0000;
        border-radius: 1px;
        transform: rotate(45deg);
        box-shadow: 0 0 15px #ff0000;
        z-index: 2;
    }

    .core-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 1px solid #ff4d4d;
        border-radius: 3px;
        animation: rotate-ring 4s infinite linear;
        opacity: 0.5;
    }

    .logo-text {
        color: var(--accent);
        font-weight: 900;
        letter-spacing: 5px;
        filter: drop-shadow(0 0 10px rgba(245, 221, 93, 0.4));
        font-size: 1.4rem;
    }

    .logo-sub {
        color: #444;
        font-family: 'monospace';
        font-size: 0.55em;
        letter-spacing: 2px;
        border-left: 1px solid #444;
        padding-left: 10px;
    }

    @keyframes rotate-ring {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }
</style>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --body-bg: #020202;
        --primary: #d31d20;
        --secondary: #1a0202;
        --accent: #f5dd5d;
        --line-color: rgba(255, 0, 0, 0.12);
    }

    /* Hintergrund mit animierten wandernden Linien */
    body {
        background-color: var(--body-bg) !important;
        background-image:
            /* Ebene 1: Wanderndes Raster */
            linear-gradient(var(--line-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--line-color) 1px, transparent 1px),
            /* Ebene 2: Tiefen-Glows */
            radial-gradient(circle at 50% 0%, #5a0000 0%, transparent 70%),
            radial-gradient(circle at 0% 100%, #2a0000 0%, transparent 40%) !important;
        background-size: 60px 60px, 60px 60px, 100% 100%, 100% 100% !important;
        background-attachment: fixed !important;
        animation: grid-move 20s infinite linear;
        /* Hier ist die Bewegung! */
        color: #e0e0e0 !important;
    }

    @keyframes grid-move {
        from {
            background-position: 0 0, 0 0, 0 0, 0 0;
        }

        to {
            background-position: 60px 60px, 60px 60px, 0 0, 0 0;
        }
    }

    /* Tech-Scanline Effekt (Horizontaler Strich der durchläuft) */
    body::after {
        content: "";
        position: fixed;
        top: -100%;
        left: 0;
        width: 100%;
        height: 100px;
        background: linear-gradient(to bottom, transparent, rgba(255, 0, 0, 0.05), transparent);
        animation: scanline 8s infinite linear;
        pointer-events: none;
        z-index: 9999;
    }

    @keyframes scanline {
        0% {
            top: -10%;
        }

        100% {
            top: 110%;
        }
    }

    /* Modernisierte Module mit schrägen Ecken und Glow */
    .module {
        background: rgba(10, 10, 10, 0.85) !important;
        border: 1px solid var(--line-color) !important;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5) !important;
        clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 0 100%);
        /* Tech-Cut oben rechts */
        backdrop-filter: blur(10px);
    }

    .module h2 {
        background: linear-gradient(90deg, #300000 0%, #600000 100%) !important;
        border-bottom: 1px solid var(--primary) !important;
        color: var(--primary) !important;
        font-family: 'monospace';
        font-size: 0.85rem !important;
        letter-spacing: 2px;
    }

    /* Buttons: Cyber-Shape */
    .button,
    input[type=submit] {
        background: transparent !important;
        border: 1px solid var(--primary) !important;
        color: var(--primary) !important;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        text-transform: uppercase;
        font-weight: 900 !important;
        transition: 0.3s;
    }

    .button:hover,
    input[type=submit]:hover {
        background: var(--primary) !important;
        color: white !important;
        box-shadow: 0 0 20px var(--primary);
        transform: scale(1.05);
    }

    /* Sidebar-Tuning */
    #nav-sidebar {
        background: rgba(0, 0, 0, 0.9) !important;
        border-right: 2px solid var(--primary) !important;
    }

    /* Inputs im Terminal-Stil */
    input[type=text],
    input[type=password],
    textarea,
    select {
        background: #000 !important;
        border: 1px solid #333 !important;
        color: #ff4d4d !important;
        font-family: 'monospace' !important;
    }

    input:focus {
        border-color: var(--primary) !important;
        box-shadow: 0 0 10px var(--primary) !important;
    }
</style>
{% endblock %}
