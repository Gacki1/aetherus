{% extends "admin/base.html" %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
        <div class="core-node"></div>
        <span class="logo-text">AETHERUS</span>
        <span class="logo-sub">[SYS_ADMIN_v2.0]</span>
    </a>
</h1>

<style>
    .core-node {
        width: 10px;
        height: 10px;
        background: #ff4d4d;
        border-radius: 2px;
        box-shadow: 0 0 15px #ff0000;
        animation: core-pulse 3s infinite ease-in-out;
        transform: rotate(45deg);
    }

    .logo-text {
        color: var(--accent);
        font-weight: 900;
        letter-spacing: 4px;
        filter: drop-shadow(0 0 10px rgba(245, 221, 93, 0.4));
    }

    .logo-sub {
        color: #555;
        font-family: 'monospace';
        font-size: 0.6em;
        letter-spacing: 2px;
    }

    @keyframes core-pulse {

        0%,
        100% {
            transform: rotate(45deg) scale(0.8);
            opacity: 0.5;
        }

        50% {
            transform: rotate(225deg) scale(1.2);
            opacity: 1;
            box-shadow: 0 0 25px #ff0000;
        }
    }
</style>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --body-bg: #030303;
        --primary: #c31417;
        --secondary: #120303;
        --accent: #f5dd5d;
        --line-base: rgba(255, 0, 0, 0.08);
        --line-bold: rgba(255, 0, 0, 0.15);
    }

    /* Der "Zufällige" Tech-Hintergrund */
    body {
        background-color: var(--body-bg) !important;
        background-image:
            /* Grobes, unregelmäßiges Raster */
            linear-gradient(var(--line-bold) 1px, transparent 1px),
            linear-gradient(90deg, var(--line-bold) 1px, transparent 1px),
            /* Feineres, versetztes Raster für "Noise" */
            linear-gradient(var(--line-base) 1px, transparent 1px),
            linear-gradient(90deg, var(--line-base) 1px, transparent 1px),
            /* Der rote Tiefen-Glow */
            radial-gradient(circle at 80% 20%, #3d0000 0%, transparent 40%),
            radial-gradient(circle at 20% 80%, #2a0000 0%, transparent 40%),
            radial-gradient(circle at 50% 0%, #610000 0%, transparent 70%) !important;

        /* Die unterschiedlichen Größen erzeugen das "zufällige" Muster */
        background-size: 120px 120px, 120px 120px, 30px 30px, 30px 30px, 100% 100%, 100% 100%, 100% 100% !important;
        background-attachment: fixed !important;
        color: #e0e0e0 !important;
    }

    /* Tech-Dekoration: Ein vertikaler Scan-Strich-Effekt */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(0deg, transparent 0%, rgba(255, 0, 0, 0.03) 50%, transparent 100%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 1000;
        opacity: 0.5;
    }

    /* Container & Module */
    #header {
        background: rgba(0, 0, 0, 0.95) !important;
        border-bottom: 2px solid var(--primary) !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8) !important;
        position: relative;
    }

    /* Schräge Tech-Kante für Module */
    .module {
        background: rgba(10, 10, 10, 0.8) !important;
        border: 1px solid var(--line-bold) !important;
        border-top: 3px solid var(--primary) !important;
        position: relative;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 5px 100%, 0 calc(100% - 5px));
        /* Abgeschnittene Ecke unten links */
    }

    /* Tabellen & Listen */
    .module h2 {
        background: #1a0202 !important;
        font-family: 'monospace';
        text-transform: uppercase;
        font-size: 0.9em;
        border-bottom: 1px solid var(--primary) !important;
        color: var(--primary) !important;
    }

    /* Buttons: Jetzt mit "Invert"-Glow */
    .button,
    input[type=submit] {
        background: transparent !important;
        border: 1px solid var(--primary) !important;
        color: var(--primary) !important;
        clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        /* "Blade Runner" Button Shape */
        padding: 5px 20px !important;
        transition: 0.3s;
    }

    .button:hover,
    input[type=submit]:hover {
        background: var(--primary) !important;
        color: #fff !important;
        box-shadow: 0 0 20px var(--primary);
    }

    /* Sidebar - Glassmorphism */
    #nav-sidebar {
        background: rgba(5, 5, 5, 0.9) !important;
        backdrop-filter: blur(10px);
        border-right: 1px solid var(--line-bold) !important;
    }

    /* Command Line Style Breadcrumbs */
    div.breadcrumbs {
        background: #000 !important;
        border-bottom: 1px solid var(--primary) !important;
        font-family: 'monospace';
        font-size: 10px;
        color: #666 !important;
    }

    div.breadcrumbs a {
        color: var(--primary) !important;
    }
</style>
{% endblock %}
