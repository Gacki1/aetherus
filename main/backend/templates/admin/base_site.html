{% extends "admin/base.html" %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
        <div class="core-container">
            <div class="core-node"></div>
            <div class="core-ring"></div>
        </div>
        <title>AETHERUS ADMIN PANEL</title>
        <span class="logo-text">AETHERUS</span>
        <span class="logo-sub">ADMIN_PANEL_v3.2</span>
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --body-bg: #010101;
        --primary: #d31d20;
        --secondary: #1a0202;
        --accent: #f5dd5d;
        --line-color: rgba(255, 0, 0, 0.15);
        --tech-border: 1px solid rgba(255, 0, 0, 0.3);
    }

    /* Hintergrund mit fließendem Raster */
    body {
        background-color: var(--body-bg) !important;
        background-image:
            linear-gradient(var(--line-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--line-color) 1px, transparent 1px),
            radial-gradient(circle at 50% 0%, #5a0000 0%, transparent 70%) !important;
        background-size: 50px 50px, 50px 50px, 100% 100% !important;
        background-attachment: fixed !important;
        animation: grid-move 4s infinite linear;
        color: #e0e0e0 !important;
    }

    @keyframes grid-move {
        from {
            background-position: 0 0, 0 0, 0 0;
        }

        to {
            background-position: 50px 50px, 50px 50px, 0 0;
        }
    }

    /* --- CYBER-BUTTONS MIT LINIEN-EFFEKT --- */
    .button,
    input[type=submit],
    input[type=button],
    .submit-row input {
        background: rgba(255, 0, 0, 0.05) !important;
        border: 1px solid rgba(255, 0, 0, 0.2) !important;
        color: var(--primary) !important;
        text-transform: uppercase;
        font-weight: 900 !important;
        padding: 8px 20px !important;
        position: relative;
        cursor: pointer;
        overflow: hidden;
        transition: all 0.3s ease;
        /* Die abgeschnittenen Ecken */
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    /* Der Linien-Effekt beim Hovern */
    .button:hover,
    input[type=submit]:hover {
        color: #fff !important;
        border-color: var(--primary) !important;
        background: rgba(255, 0, 0, 0.1) !important;
    }

    /* Wir nutzen Pseudo-Elemente für die "umziehenden" Linien */
    .button::before,
    input[type=submit]::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--primary), transparent);
        transition: 0s;
    }

    .button:hover::before,
    input[type=submit]:hover::before {
        left: 100%;
        transition: 0.6s linear;
    }

    /* --- MODULE & BOXEN --- */
    .module {
        background: rgba(5, 5, 5, 0.9) !important;
        border: 1px solid var(--line-color) !important;
        clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
        box-shadow: 10px 10px 30px rgba(0, 0, 0, 0.5) !important;
        margin-bottom: 20px !important;
    }

    .module h2 {
        background: #1a0202 !important;
        border-bottom: 1px solid var(--primary) !important;
        color: var(--primary) !important;
        font-family: 'monospace';
        letter-spacing: 2px;
        font-size: 0.8rem !important;
    }

    /* Sidebar-Styling */
    #nav-sidebar {
        background: rgba(0, 0, 0, 0.95) !important;
        border-right: 2px solid var(--primary) !important;
    }

    /* Breadcrumbs-Tuning */
    div.breadcrumbs {
        background: #000 !important;
        border-bottom: 1px solid var(--primary) !important;
        font-family: 'monospace';
        font-size: 10px;
        color: #555 !important;
    }

    /* Formularfelder passend zum Design */
    input[type=text],
    input[type=password],
    textarea,
    select {
        background: #0a0a0a !important;
        border: 1px solid #333 !important;
        color: #ff4d4d !important;
        border-radius: 0 !important;
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%);
    }

    /* Animation für das Logo-Core */
    @keyframes rotate-ring {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    .core-ring {
        animation: rotate-ring 2s infinite linear;
    }
</style>
{% endblock %}
