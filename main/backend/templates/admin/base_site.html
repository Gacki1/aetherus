{% extends "admin/base.html" %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
        <div class="core-container">
            <div class="core-node"></div>
            <div class="core-ring"></div>
        </div>
        <span class="logo-text">AETHERUS</span>
        <span class="logo-sub">OVERDRIVE_v3.1</span>
    </a>
</h1>

<style>
    .core-container {
        position: relative;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .core-node {
        width: 8px;
        height: 8px;
        background: #ff0000;
        border-radius: 1px;
        transform: rotate(45deg);
        box-shadow: 0 0 15px #ff0000;
        z-index: 2;
    }

    .core-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 1px solid #ff4d4d;
        border-radius: 3px;
        animation: rotate-ring 2s infinite linear;
        /* Kern dreht sich jetzt auch schneller */
        opacity: 0.5;
    }

    .logo-text {
        color: var(--accent);
        font-weight: 900;
        letter-spacing: 5px;
        filter: drop-shadow(0 0 10px rgba(245, 221, 93, 0.4));
        font-size: 1.4rem;
    }

    .logo-sub {
        color: #666;
        font-family: 'monospace';
        font-size: 0.55em;
        letter-spacing: 2px;
        border-left: 1px solid #666;
        padding-left: 10px;
    }

    @keyframes rotate-ring {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }
</style>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --body-bg: #020202;
        --primary: #d31d20;
        --secondary: #1a0202;
        --accent: #f5dd5d;
        --line-color: rgba(255, 0, 0, 0.15);
        /* Linien etwas deutlicher gemacht */
    }

    /* Hintergrund mit SCHNELL wandernden Linien */
    body {
        background-color: var(--body-bg) !important;
        background-image:
            linear-gradient(var(--line-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--line-color) 1px, transparent 1px),
            radial-gradient(circle at 50% 0%, #5a0000 0%, transparent 70%),
            radial-gradient(circle at 0% 100%, #2a0000 0%, transparent 40%) !important;
        background-size: 60px 60px, 60px 60px, 100% 100%, 100% 100% !important;
        background-attachment: fixed !important;

        /* Geschwindigkeit von 20s auf 5s reduziert = 4x schneller */
        animation: grid-move 5s infinite linear;
        color: #e0e0e0 !important;
    }

    @keyframes grid-move {
        from {
            background-position: 0 0, 0 0, 0 0, 0 0;
        }

        to {
            background-position: 60px 60px, 60px 60px, 0 0, 0 0;
        }
    }

    /* Scanline (body::after) wurde entfernt */

    .module {
        background: rgba(10, 10, 10, 0.9) !important;
        border: 1px solid var(--line-color) !important;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.7) !important;
        clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 0 100%);
        backdrop-filter: blur(10px);
    }

    .module h2 {
        background: linear-gradient(90deg, #300000 0%, #7a0000 100%) !important;
        border-bottom: 1px solid var(--primary) !important;
        color: #fff !important;
        font-family: 'monospace';
        letter-spacing: 2px;
    }

    .button,
    input[type=submit] {
        background: transparent !important;
        border: 1px solid var(--primary) !important;
        color: var(--primary) !important;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        text-transform: uppercase;
        font-weight: 900 !important;
        transition: 0.2s;
    }

    .button:hover,
    input[type=submit]:hover {
        background: var(--primary) !important;
        color: white !important;
        box-shadow: 0 0 25px var(--primary);
    }

    #nav-sidebar {
        background: rgba(0, 0, 0, 0.9) !important;
        border-right: 2px solid var(--primary) !important;
    }

    /* Command Line Style Breadcrumbs */
    div.breadcrumbs {
        background: rgba(0, 0, 0, 0.8) !important;
        border-bottom: 1px solid var(--primary) !important;
        font-family: 'monospace';
        color: #888 !important;
    }
</style>
{% endblock %}
