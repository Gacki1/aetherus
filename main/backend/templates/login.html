{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherus - Login</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <h2>Aetherus-Login</h2>
        <div id="message-box" class="message" style="display:none;"></div>

        <form id="login-form" action="/login{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}" method="POST">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">
            <label for="username">Benutzername</label>
            <input type="text" id="username" name="username" required autocomplete="username">

            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit">Einloggen</button>

            <label>
                <input type="checkbox" name="remember_me" id="rememberMeCheckbox">
                Angemeldet bleiben
            </label>
        </form>

        {% if error %}
        <script>document.getElementById('message-box').textContent = '{{ error }}'; document.getElementById('message-box').className = 'message error'; document.getElementById('message-box').style.display = 'block';</script>
        {% endif %}

        <div class="login-links">
            <p><a href="/password-reset">Passwort vergessen?</a></p>
            <p>Noch keinen Account? <a href="/register">Hier registrieren</a></p>
        </div>
    </div>

    <script src="{% static 'js/login.js' %}?v=3" defer></script>
</body>
</html>
