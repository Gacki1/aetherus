<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Hauptseite</title>
</head>

<body>
    <h1>Willkommen!</h1>
    <p>Der Login über Django war erfolgreich. Diese Seite wird von Nginx bereitgestellt.</p>
    <script src="main.js"></script>
    
    <script src="token_manager.js"></script>

    <button onclick="logoutUser()">Abmelden</button>
    <script src="logout.js"></script>
</body>

<script>
    async function logoutUser() {
        // Wir holen uns den CSRF-Token, den Django als Cookie setzt
        const csrfToken = document.cookie
            .split('; ')
            .find(row => row.startsWith('csrftoken='))
            ?.split('=')[1];

        try {
            const response = await fetch('/api/auth/logout/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken // Diesen Header braucht Django für Sessions!
                }
            });

            if (response.ok) {
                // Nach dem Logout im Backend löschen wir den Modus und leiten um
                localStorage.removeItem('auth_mode');
                window.location.href = '/login.html';
            } else {
                alert("Fehler beim Abmelden.");
            }
        } catch (error) {
            console.error("Netzwerkfehler beim Logout:", error);
        }
    }
</script>

</html>
