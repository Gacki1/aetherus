<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherus - Registrierung</title>
    <link rel="stylesheet" href="/css/register.css">
</head>

<body>
    <div class="bg-glow-center"></div>

    <div class="container">
        <div class="main">
            <h1>Registrieren</h1>
            <p>Werde Teil der Aetherus-Welt.</p>
        </div>

        <div id="message-box" class="message"></div>

        <form id="register-form">
            <div class="input-group">
                <label for="reg-username">Benutzername</label>
                <input type="text" id="reg-username" name="username" required>
            </div>

            <div class="input-group">
                <label for="reg-email">E-Mail Adresse</label>
                <input type="email" id="reg-email" name="email" required
                    style="width: 100%; padding: 12px; margin-bottom: 10px; box-sizing: border-box; background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9;">
            </div>

            <div class="input-group">
                <label for="reg-password">Passwort</label>
                <input type="password" id="reg-password" name="password" required>
            </div>

            <div class="input-group">
                <label for="reg-password-confirm">Passwort bestätigen</label>
                <input type="password" id="reg-password-confirm" name="re_password" required>
            </div>

            <button type="submit" class="btn-register">Account erstellen</button>
        </form>

        <p style="margin-top: 20px; font-size: 0.85rem;">Bereits einen Account? <a href="login" style="color: #58a6ff; text-decoration: none;">Hier einloggen</a></p>
    </div>

    <script src="/register.js"></script>
</body>

</html>
