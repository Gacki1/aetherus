{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherus - Passwort zurücksetzen</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <!-- Step 1: Request reset email -->
        <div id="request-step">
            <h2>Passwort zurücksetzen</h2>
            <p style="color: #8b949e; font-size: 0.85rem; text-align: center; margin-bottom: 20px;">
                Gib deine E-Mail-Adresse ein und wir senden dir einen Link.
            </p>
            <div id="message-box-request" class="message" style="display:none;"></div>
            <form id="reset-request-form">
                <label for="email" style="display:block; margin-top:15px; margin-bottom:5px; font-size:0.85rem; color:#58a6ff; font-weight:bold; text-transform:uppercase;">E-Mail Adresse</label>
                <input type="email" id="email" name="email" required
                    style="width:100%; padding:12px; margin:10px 0; box-sizing:border-box; background-color:#0d1117; border:1px solid #30363d; border-radius:6px; color:#c9d1d9;">
                <button type="submit">Link senden</button>
            </form>
            <p style="margin-top: 20px; font-size: 0.85rem;">
                <a href="/login" style="color: #58a6ff; text-decoration: none;">← Zurück zum Login</a>
            </p>
        </div>

        <!-- Step 2: Enter new password (shown when ?key= is in URL) -->
        <div id="confirm-step" style="display: none;">
            <h2>Neues Passwort setzen</h2>
            <div id="message-box-confirm" class="message" style="display:none;"></div>
            <form id="reset-confirm-form">
                <label for="new-password" style="display:block; margin-top:15px; margin-bottom:5px; font-size:0.85rem; color:#58a6ff; font-weight:bold; text-transform:uppercase;">Neues Passwort</label>
                <input type="password" id="new-password" name="new_password" required>

                <label for="confirm-password" style="display:block; margin-top:15px; margin-bottom:5px; font-size:0.85rem; color:#58a6ff; font-weight:bold; text-transform:uppercase;">Passwort bestätigen</label>
                <input type="password" id="confirm-password" name="confirm_password" required>

                <button type="submit">Passwort ändern</button>
            </form>
            <p style="margin-top: 20px; font-size: 0.85rem;">
                <a href="/login" style="color: #58a6ff; text-decoration: none;">← Zurück zum Login</a>
            </p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const resetKey = urlParams.get('key');

        // If a key is present, show the confirm form
        if (resetKey) {
            document.getElementById('request-step').style.display = 'none';
            document.getElementById('confirm-step').style.display = 'block';
        }

        // Step 1: Request reset email
        document.getElementById('reset-request-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const messageBox = document.getElementById('message-box-request');
            const submitBtn = this.querySelector('button');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Wird gesendet...';

            try {
                const response = await fetch('/api/auth/password-reset/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                messageBox.textContent = data.message;
                messageBox.className = 'message success';
                messageBox.style.display = 'block';
            } catch (error) {
                messageBox.textContent = 'Netzwerkfehler. Bitte versuche es erneut.';
                messageBox.className = 'message error';
                messageBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Link senden';
            }
        });

        // Step 2: Confirm new password
        document.getElementById('reset-confirm-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const messageBox = document.getElementById('message-box-confirm');

            if (newPassword !== confirmPassword) {
                messageBox.textContent = 'Passwörter stimmen nicht überein.';
                messageBox.className = 'message error';
                messageBox.style.display = 'block';
                return;
            }

            const submitBtn = this.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Wird geändert...';

            try {
                const response = await fetch('/api/auth/password-reset/confirm/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        key: resetKey,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    messageBox.textContent = data.message;
                    messageBox.className = 'message success';
                    messageBox.style.display = 'block';
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    messageBox.textContent = data.error;
                    messageBox.className = 'message error';
                    messageBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Passwort ändern';
                }
            } catch (error) {
                messageBox.textContent = 'Netzwerkfehler. Bitte versuche es erneut.';
                messageBox.className = 'message error';
                messageBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Passwort ändern';
            }
        });
    </script>
</body>
</html>
