{% extends "base.html" %}

{% block title %}Stoxview – Aetherus{% endblock %}

{% block extra_css %}
<style>
    /* Override dashboard-container padding for full-bleed iframe */
    .dashboard-container {
        padding: 0 !important;
        max-width: 100% !important;
        height: calc(100vh - 56px); /* full viewport minus navbar */
        overflow: hidden;
    }

    .stoxview-frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: #0f172a;
    }

    .stoxview-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: rgba(255, 255, 255, 0.5);
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 0.9rem;
        gap: 10px;
    }

    .stoxview-loading .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: rgba(0, 136, 255, 0.7);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div id="stoxview-loading" class="stoxview-loading">
    <div class="spinner"></div>
    <span>Stoxview wird geladen…</span>
</div>
<iframe
    id="stoxview-iframe"
    class="stoxview-frame"
    src="https://www.perplexity.ai/computer/a/stoxview-market-prediction-das-5P2KlTgcQwOrWjWzOZR9dg"
    allow="clipboard-write"
    loading="eager"
    style="display:none;"
    onload="document.getElementById('stoxview-loading').style.display='none'; this.style.display='block';"
></iframe>
{% endblock %}
