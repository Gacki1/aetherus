<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Hauptseite</title>
</head>

<body>
    <h1>Willkommen!</h1>
    <p>Der Login über Django war erfolgreich. Diese Seite wird von Nginx bereitgestellt.</p>
    <script src="main.js"></script>
    
    <script src="token_manager.js"></script>

    <button onclick="logoutUser()">Abmelden</button>
    <script src="logout.js"></script>
</body>

<script>
    const authMode = localStorage.getItem('auth_mode'); // 'tab_session' oder 'browser_session'

        if (authMode === 'tab_session') {
            window.addEventListener('beforeunload', function (e) {
                // Dieser Code wird ausgeführt, wenn der Tab geschlossen wird
                // Wir nutzen navigator.sendBeacon für den Logout, da fetch beim Schließen 
                // des Tabs oft abgebrochen wird.
                navigator.sendBeacon('/api/auth/logout/');
            });
        }
</script>

</html>
