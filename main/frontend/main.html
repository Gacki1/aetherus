<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Hauptseite</title>
</head>

<body>
    <h1>Willkommen!</h1>
    <p>Der Login über Django war erfolgreich. Diese Seite wird von Nginx bereitgestellt.</p>
    <script src="main.js"></script>
    
    <script src="token_manager.js"></script>

    <button onclick="logoutUser()">Abmelden</button>
    <script src="logout.js"></script>
</body>

<script>
    const authMode = localStorage.getItem('auth_mode');

        if (authMode === 'tab') {
            if (!sessionStorage.getItem("tab_active")) {
                logoutUser();
            }
            sessionStorage.setItem("tab_active", "true");
        }
</script>

</html>
