# .github/workflows/deploy.yml
name: Auto Deployment aetherus.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4
        # WICHTIG: Verwenden Sie 'path' und 'ssh-known-hosts' NICHT, wenn Sie appleboy/ssh-action verwenden.
        # appleboy/ssh-action führt den Pull direkt auf dem Server durch.

      - name: 🚀 Deployment auf Ubuntu-Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            PROJECT_DIR="/home/aetherus"
            
            cd $PROJECT_DIR

            echo "1. Starte Git Pull (Abrufen der neuesten Änderungen über HTTPS)"

            # **KORREKTUR:** Temporäre HTTPS-URL mit Token verwenden
            REPO_URL="https://Gacki1:${{ secrets.AETHERUS_DEPLOY_KEY }}@github.com/Gacki1/aetherus.git"
            
            # 1. Setzt eine temporäre Remote-URL
            git remote set-url origin $REPO_URL
            
            # 2. Führt den Pull aus (jetzt funktioniert 'origin main')
            git pull origin main
            
            # 3. Setzt die Remote-URL zurück auf SSH (reinigt die Konfiguration)
            git remote set-url origin git@github.com:Gacki1/aetherus.git

            # WICHTIG: Erneutes Build-Befehl für die Django-Korrekturen
            git reset --hard origin/main
            git clean -fd
            
            echo "2. Erzeuge neues Docker-Image (mit neuem Code)"
            # `--no-cache` ist hier WICHTIG, damit die Umstrukturierung greift!
            docker compose build --no-cache backend
            
            echo "3. Starte alle Container neu"
            docker compose up -d --force-recreate --remove-orphans
            
            echo "4. Führe Datenbank-Migrationen aus"
            docker compose exec backend python manage.py migrate