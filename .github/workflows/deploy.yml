# .github/workflows/deploy.yml
name: Auto Deployment via SSH

on:
  push:
    # Der Workflow startet bei jedem Push auf den 'main' Branch
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH and Restart Docker
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Zum Projektverzeichnis wechseln
            cd /home/aetherus/
            
            # 2. Neueste Änderungen von GitHub holen
            # (Stellen Sie sicher, dass der Git-Repository-Code
            # in Ihrem 'website-files' Ordner liegt oder dorthin gesynct wird)
            git pull origin main
            
            # 3. Docker Compose neu starten
            # 'up -d' erstellt neue Container, falls Änderungen nötig sind,
            # stoppt die alten und startet sie neu.
            docker compose up -d --force-recreate
