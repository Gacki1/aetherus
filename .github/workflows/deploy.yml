# .github/workflows/deploy.yml
name: Auto Deployment aetherus.net

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Deployment auf Ubuntu-Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Zum Projekt-Root-Verzeichnis wechseln (/home/aetherus)
            PROJECT_DIR="/home/aetherus"
            
            # 2. Neueste Änderungen von GitHub holen
            # Der '-C' Parameter führt den Befehl im angegebenen Verzeichnis aus.
            git -C $PROJECT_DIR pull origin main
            
            # 3. Zum Docker Compose Ordner wechseln
            cd $PROJECT_DIR
            
            # 4. Docker Compose neu starten
            # 'up -d' liest die aktualisierte docker-compose.yml (die sich im aktuellen Ordner befindet)
            docker compose up -d --force-recreate